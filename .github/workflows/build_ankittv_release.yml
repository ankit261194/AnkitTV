name: Build Ankit TV Release APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Ankit TV Release APK
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableRelease --stacktrace

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ankit-TV-Release-APKs
          path: smarttubetv/build/outputs/apk/ststable/release/*.apk
